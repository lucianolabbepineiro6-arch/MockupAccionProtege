<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Acción Protege{% endblock %}</title>
<style>
body{font-family:Arial,sans-serif;margin:0;line-height:1.5}
header,footer{background:#111;color:#fff;padding:12px 16px}
nav a{color:#fff;margin-right:12px;text-decoration:none}
main{padding:16px;max-width:900px;margin:auto}
.cta{display:inline-block;background:#c00;color:#fff;padding:10px 18px;text-decoration:none;border-radius:4px;margin:12px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{border:1px solid #ddd;padding:12px;border-radius:6px}
form input,form textarea{width:100%;padding:8px;margin:6px 0;box-sizing:border-box}
.aviso{font-size:.9em;background:#f5f5f5;padding:10px;border-left:4px solid #c00}
</style>
</head>
<body>
<header>
<nav>
<a href="{% url 'home' %}">Inicio</a>
<a href="{% url 'nosotros' %}">Nuestra empresa</a>
<a href="{% url 'lista' %}">Servicios</a>
<a href="{% url 'contacto' %}">Contáctanos</a>
</nav>
</header>
<main>{% block content %}{% endblock %}</main>
<footer>
<p>Teléfono 562 23359125 | Av. Nueva Los Leones Nº 0243 Of. 11 Providencia Santiago | Gerente General: Jorge Méndez Espinoza</p>
<p><a style="color:#fff" href="{% url 'privacidad' %}">Política de privacidad Ley 21.719</a> | Mockup Django KAN-011 - contenido real WP 2015</p>
</footer>
</body>
</html>
